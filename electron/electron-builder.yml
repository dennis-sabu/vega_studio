appId: com.vega.studio
productName: VEGA Studio
executableName: vega-studio
copyright: Copyright (c) VEGA Studio Contributors

directories:
  output: ../release
  buildResources: ../build

asar: true

files:
  - dist/**/*
  - package.json
  - "!**/*.ts"
  - "!**/*.map"
  - "!**/node_modules/.cache/**"

extraResources:
  - from: ../frontend/out
    to: frontend/out
    filter:
      - "**/*"
      - "!**/*.map"
  - from: ../build/backend-dist/vega-backend
    to: backend/vega-backend
    filter:
      - "**/*"
      - "!**/__pycache__/**"
      - "!**/*.pyc"
  - from: ../build/icons/256x256.png
    to: build/icons/256x256.png
  - from: ../build/linux/com.vega.studio.metainfo.xml
    to: linux/com.vega.studio.metainfo.xml

linux:
  executableName: vega-studio
  icon: ../build/icons
  category: Development;IDE;Electronics;
  synopsis: Desktop Firmware IDE for C-DAC VEGA ARIES V3 RISC-V
  description: >-
    Self-contained desktop IDE for C-DAC VEGA ARIES V3 RISC-V embedded firmware
    development with Monaco Editor, Make build orchestration, XMODEM flashing,
    USB-UART serial monitor, POSIX PTY terminal, Git/GitHub tools, and AI assistance.
  desktop:
    entry:
      Name: VEGA Studio
      Comment: Desktop Firmware IDE for C-DAC VEGA ARIES V3 RISC-V
      GenericName: Embedded Firmware IDE
      Categories: Development;IDE;Electronics;
      StartupWMClass: vega-studio
      StartupNotify: "true"
      Keywords: RISC-V;VEGA;ARIES;Embedded;Firmware;C;IDE;
  target:
    - target: deb
      arch:
        - x64
    - target: AppImage
      arch:
        - x64

deb:
  packageCategory: devel
  priority: optional
  maintainer: VEGA Studio Team <maintainers@vega-studio.local>
  artifactName: vega-studio_${version}_amd64.${ext}
  depends:
    - libgtk-3-0t64 | libgtk-3-0
    - libnotify4
    - libnss3
    - libxss1
    - libxtst6
    - xdg-utils
    - libatspi2.0-0t64 | libatspi2.0-0
    - libuuid1
    - libsecret-1-0
    - libasound2t64 | libasound2
  recommends:
    - git
    - make
    - python3
    - libsecret-tools
    - gh
  afterInstall: ../build/linux/after-install.sh
  afterRemove: ../build/linux/after-remove.sh

appImage:
  artifactName: vega-studio_${version}_x86_64.${ext}
